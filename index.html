<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConf-2026</title>
    <!-- css link -->
    <link rel="stylesheet" href="./style.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- font awesome lonk -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!--nav bar section started-->
    <header>
        <nav class="cmn-width">
            <!-- left nav -->
            <div>
                <a href=""><img class="nav-logo-img" src="./images/logo.png" alt="DevConf-2026 Logo"></a>
            </div>
            <!-- middle nav -->
            <div>
                <ul class="nav-list">
                    <li>
                        <a href="#">Speakers</a>
                    </li>
                    <li>
                        <a href="#">Schedule</a>
                    </li>
                    <li>
                        <a href="#">Tracks</a>
                    </li>
                    <li>
                        <a href="#">Venu</a>
                    </li>
                    <li>
                        <a href="#">Blog</a>
                    </li>
                </ul>
            </div>
            <!-- right nav -->
            <div>
                <button class="nav-btn">Register Now</button>
            </div>
        </nav>
    </header>
    <!-- nav bar end -->
    <!-- main section start -->
    <main>
        <!-- Hero section Start -->
        <section class="hero-section">
            <div class="top-hero">
                <h1>
                    Code.<br><em>Connect.</em><br>Correct
                </h1>
                <p>
                    Join 4,000+ engineers, founders, and builders at the premier developer conference of 2026. Three
                    days of cutting-edge talks, hands-on workshops, and meaningful connections.
                </p>

            </div>
            <div class="bottom-hero">
                <button>Register Now</button>
            </div>
        </section>
        <!-- Hero section End -->

    </main>
    <!-- main section End -->
    <!-- footer section Start -->
    <footer>
        <div class="full-footer cmn-width">
            <div class="footer-top">
                <div class="footer-top-left">
                    <a href="#"><img src="./images/logo-mini.png" alt="DevConf 2026 Logo"></a>
                </div>
                <div class="footer-top-right">
                    <ul class="social-list">
                        <li><a href="https://facebook.com/"><i class="fa-brands fa-facebook"></i></a></li>
                        <li><a href="https://reddit.com/"><i class="fa-brands fa-reddit"></i></a></li>
                        <li><a href="https://x.com/"><i class="fa-brands fa-x-twitter"></i></a></li>
                    </ul>
                </div>
            </div>
            <hr>
            <div class="footer-bottom">
                <p>© 2026 DevConf. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <!-- footer section End -->

</html>
